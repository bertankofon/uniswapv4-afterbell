[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 200
fail_on_revert = false

[lint]
lint_on_build = false
